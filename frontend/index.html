<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabe no Bolso - CNB</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container" id="login-box">
        <h1>Cabe no Bolso</h1>
        <p>Organize suas finanças, rotinas e estudos com IA.</p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="toggle-form">
            Ainda não tem conta? <a href="#" id="show-register">Cadastre-se</a>
        </div>
    </div>

    <!-- O Javascript para chamar a sua API será inserido no próximo passo -->
    <script src="js/auth.js"></script>
</body>
</html>
